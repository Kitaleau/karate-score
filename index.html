<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>空手 採点ツール</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="空手採点">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1b1e21">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
/* 元のアプリ（空手道競技ツール）の見た目にそろえる：白地、黄土色の試合場、灰色の点の枠、白い−と赤い＋ */
:root{
  color-scheme:light;
  --bg:#ffffff; --surface:#ffffff; --ink:#111111; --muted:#666666; --line:#cccccc;
  --mat:#efc68c; --box:#d3d3d3; --box-edge:#b4b4b4; --red:#ff2a00; --on-red:#ffffff; --blue:#1414ff; --link:#1a7cff;
  --hi:#c9b6f3; --hi-ink:#a98bdf; --lo:#8fe5ab; --lo-ink:#45c46f; --score:#e8231a;
  --drop:#8e969c; --good:#1d7444; --warn:#9a5600; --warn-bg:#fff3c4; --end-bg:#ffe0dc; --soft:#f2f2f2;
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","BIZ UDPGothic","Yu Gothic","Meiryo",sans-serif;
  --num:"Hiragino Sans","Helvetica Neue","Arial",sans-serif;
  --display:"Hiragino Sans","Yu Gothic",sans-serif;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
[hidden]{display:none!important}
button,select,input,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-size:1.3rem;margin:0;letter-spacing:.04em}
.saved{font-size:.8rem;color:var(--muted)}
.ttl{width:100%;font-size:.95rem;font-weight:700;margin:2px 0 0}
.ttl:empty{display:none}
.filebtn{display:inline-flex;align-items:center;cursor:pointer}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:calc(100% - 32px);background:#222;color:#fff;padding:12px 16px;border-radius:10px;font-size:.95rem;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
.saved.bad{color:var(--warn);font-weight:700}

.tabs{display:grid;grid-template-columns:repeat(7,1fr);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs button{padding:10px 0;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--link);font-size:.85rem;white-space:nowrap;letter-spacing:-.02em}
@media (max-width:520px){.tabs button{font-size:.72rem}}
@media (max-width:420px){.tabs button{font-size:.64rem;letter-spacing:-.06em}}
.sq{width:100%;font-size:1.1rem;padding:10px 12px}
.sres{display:grid;gap:10px;margin-top:10px}
.scard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.scard h3{margin:0 0 6px;font-size:1.05rem}
.scard h3 small{font-weight:400;color:var(--muted);margin-left:6px}
.scard .kana{display:block;font-size:.8rem;font-weight:400;color:var(--muted)}
.sres,.scard{min-width:0}
.srow .no{white-space:nowrap;text-align:right}
.srow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;border:0;border-top:1px dashed var(--line);background:transparent;padding:8px 0;color:inherit;font:inherit}
.srow:first-of-type{border-top:0}
.srow .when{font-weight:700;color:var(--red)}
.srow .div{grid-column:1/-1;font-size:.85rem;color:var(--muted)}
.tabs button[aria-pressed="true"]{border-bottom-color:var(--link);color:var(--ink);font-weight:700}
/* 対戦表 */
.bkwrap{overflow-x:auto;margin:8px 0;-webkit-overflow-scrolling:touch}
.bksvg{display:block}
.bksvg line{stroke:var(--drop);stroke-width:1.5}
.bksvg line.w{stroke:var(--red);stroke-width:3.5}
.bksvg line.r{stroke:var(--link);stroke-width:3.5}
.bksvg .nm{font-size:13px;fill:var(--ink);font-family:var(--font)}
.bksvg .nm.out{fill:var(--drop)}
.bksvg .nm.ch{font-weight:700;fill:var(--red)}
.bksvg .sc{font-size:10px;text-anchor:end;fill:var(--ink);font-family:var(--num)}
.bksvg .tie{font-size:10px;fill:var(--warn);font-weight:700}
.bksvg .fin{fill:var(--soft);stroke:var(--drop)}
.bksvg .fint{font-size:12px;font-weight:700;fill:var(--ink);text-anchor:middle}
.bksvg .hit{fill:transparent;cursor:pointer}
.bksvg .hit.sel{fill:rgba(26,124,255,.18);stroke:var(--link)}
.bkleg{font-size:.8rem;color:var(--muted)}
.bkleg b.w{color:var(--red)} .bkleg b.r{color:var(--link)}
.bked{border:2px solid var(--link);border-radius:10px;padding:10px;margin:8px 0}
.bkside{margin:10px 0;padding-top:8px;border-top:1px dashed var(--line)}
.bkname{font-weight:700}
.bkname small{color:var(--muted);margin-left:6px;font-weight:400}
.bkin{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0}
.bkin input{width:100%;min-width:0;font-size:1.05rem;text-align:center;padding:8px 0;font-family:var(--num);border:1px solid var(--line);border-radius:6px}
.bkpt{font-family:var(--num);margin-bottom:6px}
.bkres{font-weight:700;margin:8px 0;color:var(--red)}
.srow.sel{outline:2px solid var(--link)}
.bktbl{width:100%;border-collapse:collapse;margin-top:6px}
.bktbl td,.bktbl th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > *{min-width:0}
.lbl{font-size:.8rem;color:var(--muted);letter-spacing:.05em}
select,input[type=text],textarea{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;font-size:16px}
select.grow,input.grow{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--soft);padding:9px 11px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--surface)}
.step{display:inline-flex;align-items:center;gap:6px}
.step button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--soft);font-size:1.2rem;font-weight:700}
.step b{min-width:3.2ch;text-align:center;font-size:1.2rem}
.btn{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:10px 14px;font-weight:700}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--red)}
.btn.armed{background:var(--red);color:var(--on-red);border-color:var(--red)}

/* 採点画面（元のアプリの並び） */
.sc{display:flex;flex-direction:column;gap:10px;max-width:440px;width:100%;margin:0 auto}
.sc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sc-top select{max-width:46%;font-size:.85rem;padding:6px 8px;border-radius:0;background:var(--surface)}
.sc-top .memo{flex:1;max-width:54%;border:1px solid var(--line);border-radius:0;background:var(--surface);text-align:right;padding:6px 8px}
.sc-set{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gbox{background:#e3e3e3;border:1px solid #d0d0d0;border-radius:0;color:var(--link);font-size:1.35rem;padding:4px 12px;line-height:1.3}
.sc-set .bl{display:flex;align-items:center;gap:6px;font-size:1.35rem}
.pnav{display:flex;justify-content:flex-end;align-items:center;gap:6px}
.pnav .arr{border:0;background:transparent;color:var(--blue);font-size:1.7rem;font-weight:900;padding:0 8px;line-height:1}
.pnav select{background:#e8e8e8;border:0;border-radius:0;color:var(--link);font-size:1.05rem;padding:6px 8px;max-width:70%}
.pinfo{display:grid;grid-template-columns:4.5em 1fr 1fr;gap:4px}
.rnd{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.rnd button{border:1px solid var(--link);background:var(--bg);color:var(--link);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.9rem}
.rnd button[aria-pressed="true"]{background:var(--link);color:#fff}
.bkbar{border:2px solid var(--link);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:.9rem}
.bkbar .row{margin-top:6px;gap:6px;flex-wrap:wrap}
.bkbar .btn{padding:8px 10px;font-size:.85rem}
.bkchg{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:12px}
.bkchg h4{margin:12px 0 4px}
.bkchg .row{gap:6px;flex-wrap:wrap}
.absrow{margin:6px 0;gap:8px;align-items:center}
.absent{color:var(--red)}
.bkside .row{gap:6px;flex-wrap:wrap}
.pinfo input{border-radius:0;padding:5px 7px;font-size:15px;background:var(--surface)}

.court{background:var(--mat);padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px 16px}
.judge{display:flex;flex-direction:column;gap:6px}
.jscore{height:48px;border-radius:0;border:2px solid var(--box-edge);border-right-color:#e9e9e9;border-bottom-color:#e9e9e9;background:var(--box);font-family:var(--num);font-size:1.75rem;color:#222;font-variant-numeric:tabular-nums}
.jscore.empty{font-size:1.4rem;font-family:var(--font)}
.judge.dmax .jscore{background:var(--hi)}
.judge.dmin .jscore{background:var(--lo)}
.pm{display:flex;justify-content:space-between}
.pm button{width:36px;height:46px;border-radius:0;font-size:1.4rem;border:1px solid #d6d6d6;line-height:1;padding:0}
.pm .minus{background:#ffffff;color:var(--blue)}
.pm .plus{background:var(--red);color:var(--blue);border-color:#f0f0f0}
.mat{border:3px solid #ffffff;min-height:150px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:28px}
.mat i{display:block;width:16px;height:9px;border-top:3px solid #fff;position:relative}
.mat i::before{content:"";position:absolute;left:5px;top:-11px;width:3px;height:9px;background:#fff}
.mid{display:flex;align-items:center;justify-content:center}
.pill{border:1px solid #c8c8c8;background:#f3f3f3;border-radius:999px;font-size:.85rem;padding:3px 16px}
.pill.armed{background:var(--red);color:#fff;border-color:var(--red)}

.sums{display:grid;grid-template-columns:1fr 40px 1fr 1fr;gap:2px 6px;align-items:center;text-align:center}
.sums .h{font-size:1.15rem}
.sums .h.lo{color:var(--lo-ink)} .sums .h.hi{color:var(--hi-ink)} .sums .h b{color:var(--ink);font-weight:400}
.sums .v{border:1px solid #d6d6d6;height:42px;display:flex;align-items:center;justify-content:center;font-family:var(--num);font-size:1.45rem;font-variant-numeric:tabular-nums}
.sums .v.main{color:var(--score)}
.loupe{border:0;background:transparent;padding:0;width:40px;height:42px;display:flex;align-items:center;justify-content:center}
.status{font-size:.95rem;text-align:center}
.status b{font-size:1.15rem}
.next-big{height:50px;border-radius:0;border:1px solid #c8c8c8;background:#e8e8e8;color:var(--link);font-size:1.1rem}

/* 順位表 */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.95rem;background:var(--surface)}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:center;white-space:nowrap}
th{font-size:.75rem;color:var(--muted);background:var(--soft);position:sticky;top:0}
td.l{text-align:left}
td.rank{font-family:var(--num);font-size:1.35rem;font-weight:700}
td.big{font-family:var(--num);font-size:1.15rem;font-weight:700}
td .x{color:var(--drop);text-decoration:line-through}
.chip{display:inline-block;font-size:.7rem;padding:1px 6px;border-radius:99px;border:1px solid currentColor;margin-left:4px;font-weight:700;white-space:nowrap}
.chip.w{color:var(--warn)} .chip.g{color:var(--good)}
.note{font-size:.82rem;color:var(--muted)}
tr.todo td{color:var(--muted)}

.divlist{display:flex;flex-direction:column;gap:8px}
.divrow{display:grid;grid-template-columns:1fr auto;gap:6px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--soft)}
.plist{display:flex;flex-direction:column;gap:4px}
.prow{display:grid;grid-template-columns:3.2em 1.3fr 1fr auto auto auto;gap:4px;align-items:center}
.prow input{padding:6px 8px;min-width:0}
@media (max-width:520px){.prow{grid-template-columns:2.6em 1fr 1fr 28px 28px 28px;gap:3px}.prow input{padding:6px 4px;font-size:15px}.prow button{min-width:28px;padding:0}}
.prow button{height:36px;min-width:36px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
textarea{width:100%;min-height:110px;resize:vertical}
h2{font-size:1rem;margin:0}
.example{font-size:.82rem;color:var(--warn);font-weight:700}

/* タイマー */
.tw{display:flex;flex-direction:column;gap:10px;max-width:440px;width:100%;margin:0 auto;align-items:stretch}
.tdisp{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:min(21vw,6.5rem);line-height:1.1;text-align:center;padding:4px;background:var(--bg)}
.tdisp.warn{background:var(--warn-bg)}
.tdisp.end{background:var(--end-bg);color:var(--red)}
.tadj{display:flex;justify-content:center;gap:10px}
.tadj button{border:1px solid #c8c8c8;background:#e8e8e8;border-radius:0;font-size:.8rem;padding:4px 10px;min-width:56px}
.tbtns{display:flex;justify-content:center;gap:14px}
.tbtns button{min-width:120px;height:50px;border-radius:0;font-size:1.1rem;border:1px solid #c8c8c8;background:#e8e8e8;color:#333}
.tbtns .go.pause{background:#d6d6d6}
.tset{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}

/* 形カード */
.kcard{min-height:9.5rem;border-radius:14px;border:3px double var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;background:var(--surface)}
.kcard .name{font-family:var(--display);font-size:min(14vw,4rem);line-height:1.15;font-weight:700}
.kcard .yomi{font-size:1rem;color:var(--muted)}
.kcard.flip{animation:flip .35s ease}
@keyframes flip{from{transform:rotateX(80deg);opacity:.2}to{transform:none;opacity:1}}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5em,1fr));gap:6px}
.kgrid label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--soft);font-size:.92rem}

/* 数字入力・拡大表示 */
.pad{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;
  padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.pad-card{background:var(--surface);width:100%;max-width:440px;border-radius:14px 14px 0 0;padding:14px 16px 18px;display:flex;flex-direction:column;gap:10px}
.pad-head{display:flex;justify-content:space-between;align-items:center}
.pad-head b{font-size:1.1rem}
.pad-val{font-family:var(--num);font-size:2.6rem;text-align:center;border:2px solid var(--line);border-radius:10px;padding:4px;min-height:1.5em}
.pad-val.err{border-color:var(--red);color:var(--red);font-size:1.1rem;font-family:var(--font);display:flex;align-items:center;justify-content:center}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{height:56px;border-radius:10px;border:1px solid var(--line);background:var(--soft);font-family:var(--num);font-size:1.5rem}
.pad-ok{height:56px;border-radius:10px;border:0;background:var(--blue);color:var(--surface);font-weight:700;font-size:1.1rem}
.bigov{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.bigov .who{font-size:1.3rem;font-weight:700}
.bigov .k{font-size:1rem;color:var(--red);font-weight:700}
.bigov .v{font-family:var(--num);font-size:min(30vw,11rem);line-height:1}
.bigov .sub{display:flex;gap:18px;font-size:1.05rem}
.bigov .sub b{font-family:var(--num);font-size:1.5rem}
.bigov .js{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-family:var(--num)}
.bigov .js span{border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.bigov .js .x{color:var(--drop);text-decoration:line-through}

@media (max-width:380px){ .jscore{font-size:1.45rem;height:52px} .pm button{height:42px} .pinfo{grid-template-columns:4.5em 1fr} .pinfo input:nth-child(3){grid-column:1 / -1} .seg button{padding:9px 8px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>空手 採点ツール</h1>
    <span id="saved" class="saved">この端末に自動保存</span>
    <div id="ttl" class="ttl"></div>
  </header>
  <nav class="tabs" aria-label="画面の切り替え">
    <button data-a="view" data-v="score">採点</button>
    <button data-a="view" data-v="rank">順位表</button>
    <button data-a="view" data-v="bk">対戦表</button>
    <button data-a="view" data-v="search">選手検索</button>
    <button data-a="view" data-v="timer">タイマー</button>
    <button data-a="view" data-v="kata">形カード</button>
    <button data-a="view" data-v="setup">区分・選手</button>
  </nav>
  <main id="main"></main>
</div>
<div id="pad" class="pad" hidden></div>
<div id="big" class="bigov" hidden></div>

<script>
(function(){
const KEY='kata-score-v1';
const J_NAMES=['主審','副審1','副審2','副審3','副審4','副審5','副審6'];
const KATA=[['平安初段','へいあん しょだん'],['平安二段','へいあん にだん'],['平安三段','へいあん さんだん'],['平安四段','へいあん よだん'],['平安五段','へいあん ごだん'],
  ['鉄騎初段','てっき しょだん'],['鉄騎二段','てっき にだん'],['鉄騎三段','てっき さんだん'],['抜塞大','ばっさい だい'],['観空大','かんくう だい'],
  ['慈恩','じおん'],['燕飛','えんぴ'],['半月','はんげつ'],['十手','じって'],['岩鶴','がんかく'],['抜塞小','ばっさい しょう'],['観空小','かんくう しょう'],
  ['珍手','ちんて'],['雲手','うんす'],['壮鎮','そうちん'],['明鏡','めいきょう'],['二十四歩','にじゅうしほ'],['五十四歩大','ごじゅうしほ だい'],
  ['五十四歩小','ごじゅうしほ しょう'],['王冠','わんかん'],['慈陰','じいん']];
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f=t=>(t/10).toFixed(1);
const newP=()=>({id:uid(),no:'',name:'',kana:'',team:'',memo:'',s:Array(7).fill(null)});

let S, canSave=true;
try{ const raw=localStorage.getItem(KEY); S=raw?JSON.parse(raw):null; }catch(e){ S=null; canSave=false; }
if(!S||!Array.isArray(S.divs)) S={tie:'min',view:'score',cur:0,divs:[]};

S.timer=S.timer||{dur:120000,warn:30000};

const div=()=>S.divs[Math.min(S.cur,S.divs.length-1)]||null;
const player=d=>d&&d.players.length?d.players[Math.min(d.pi||0,d.players.length-1)]:null;

/* 計算：最高点・最低点を1つずつ除いた合計が得点 */
function calc(p,d){
  const s=p.s.slice(0,d.judges);
  if(s.some(v=>v==null)) return null;
  const sorted=s.slice().sort((a,b)=>a-b), mn=sorted[0], mx=sorted[sorted.length-1];
  const sum=s.reduce((a,b)=>a+b,0), base=sum-mn-mx;
  return {base,mn,mx,plusMin:base+mn,plusMax:sum,baseMax:base+mx,total:sum,minIdx:s.indexOf(mn),maxIdx:s.lastIndexOf(mx)};
}
const keys=c=>S.tie==='min'?[c.base,c.plusMin,c.total]:[c.base,c.baseMax,c.total];
function cmp(a,b){const x=keys(a.c),y=keys(b.c);for(let i=0;i<3;i++){if(x[i]!==y[i])return y[i]-x[i];}return 0;}
function ranked(d){
  // 決勝のある試合（対戦表の box）は、決勝に進んだ選手の決勝の点で順位を出す
  const rows=d.bk&&d.bk.type==='box'&&!isKumite(d)
    ? finalists(d).filter(x=>x.no!=null).map(x=>{ const p=pByNo(d,x.no), s=slotArr(d,d.bk.entries[x.k],'F'+x.k,'a',x.no,false)||Array(7).fill(null);
        return {p:Object.assign({},p,{s}),i:d.players.indexOf(p),c:calc({s},d)}; })
    : d.players.map((p,i)=>({p,i,c:calc(p,d)}));
  const done=rows.filter(r=>r.c).sort(cmp), todo=rows.filter(r=>!r.c);
  const second=S.tie==='min'?'＋最低点':'＋最高点', third=S.tie==='min'?'＋最高点':'＋最低点';
  done.forEach((r,i)=>{
    r.rank=(i>0&&cmp(done[i-1],r)===0)?done[i-1].rank:i+1;
    const k=keys(r.c); let lv=0;
    [done[i-1],done[i+1]].forEach(o=>{ if(!o) return; const q=keys(o.c);
      if(q[0]===k[0]) lv=Math.max(lv, q[1]!==k[1]?1:(q[2]!==k[2]?2:3)); });
    r.note=['',second+'で決定',third+'で決定','完全に同点'][lv];
  });
  return {done,todo};
}

}

let SQ='';
function viewSearch(){

}
function drawSearch(){
  const el=document.getElementById('sres'); if(!el) return;
  const hira=s=>String(s||'').replace(/[\s　]/g,'').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
  const q=SQ.replace(/[\s　]/g,''), qh=hira(SQ);
  if(!q){ el.innerHTML=''; return; }
  const groups=new Map();
  S.divs.forEach((d,i)=>d.players.forEach((p,j)=>{
    if(!p.name.replace(/[\s　]/g,'').includes(q) && !(p.kana&&hira(p.kana).includes(qh))) return;
    const k=p.name.replace(/[\s　]/g,'')+'|'+(p.team||'');
    if(groups.has(k)&&!groups.get(k).kana&&p.kana) groups.get(k).kana=p.kana;
    if(!groups.has(k)) groups.set(k,{name:p.name,kana:p.kana||'',team:p.team,rows:[]});
    groups.get(k).rows.push({d,i,j,p});
  }));
  if(!groups.size){ el.innerHTML='<div class="note">見つかりませんでした。</div>'; return; }
  const rank=x=>x.d.sched?(x.d.sched.part==='午前'?0:x.d.sched.part?1:2)*1000+(x.d.sched.order||0)*10+x.d.sched.court/10:9999;
  el.innerHTML=[...groups.values()].sort((a,b)=>a.name.localeCompare(b.name,'ja')).map(g=>`<div class="scard"><h3>${esc(g.name)}<small>${esc(g.team||'')}</small>${g.kana?`<span class="kana">${esc(g.kana)}</span>`:''}</h3>`+
    g.rows.sort((a,b)=>rank(a)-rank(b)).map(x=>{ const s=x.d.sched;
      const when=!s?'時間・コートは未登録':s.part?`${s.part} ${s.start}〜・${s.court}コート・${s.order}番目の試合`:`${s.court}コート（時間・順番は未登録）`;
      return `<button class="srow" data-a="goP" data-i="${x.i}" data-j="${x.j}"><span class="when">${esc(when)}</span><span class="no">番号 <b>${esc(x.p.no)}</b></span><span class="div">${esc(x.d.name)}</span></button>`; }).join('')+`</div>`).join('');
}

/* 組手タイマー */
const T={left:S.timer.dur,running:false,last:0,warned:false,ended:false};
const fmtT=ms=>{ const t=Math.ceil(Math.max(0,ms)/100), m=Math.floor(t/600), s=Math.floor((t%600)/10), d=t%10; return m+"'"+String(s).padStart(2,'0')+'"'+d; };
const fmtS=ms=>{ const s=Math.round(ms/1000); return Math.floor(s/60)+'分'+String(s%60).padStart(2,'0')+'秒'; };
let AC=null;
function ensureAudio(){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){} }
function beep(freq,dur,times,gap){
  if(!AC) return;
  for(let i=0;i<times;i++){ const t0=AC.currentTime+i*(dur+gap), o=AC.createOscillator(), g=AC.createGain();
    o.type='square'; o.frequency.value=freq; g.gain.setValueAtTime(0.25,t0); g.gain.setValueAtTime(0,t0+dur);
    o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0+dur+0.02); }
}
function viewTimer(){
  const t=S.timer;
  const adj=sign=>`<div class="tadj">${[[60000,'1M'],[10000,'10S'],[1000,'1S']].map(([ms,l])=>`<button data-a="tAdj" data-d="${sign*ms}" aria-label="${l}${sign>0?'増やす':'減らす'}">${sign>0?'+':'-'}${l}</button>`).join('')}</div>`;
  return `<div class="tw">

    <div class="note">「あとしばらく」は予鈴を鳴らす残り時間です（5秒きざみ）。予鈴で短い音が2回、終了で長い音が1回鳴ります。止めている間は、上下の＋−で残り時間を直せます。iPhoneは、消音（マナー）スイッチが入っていると音が出ないことがあります。</div>
  </div>`;
}

/* 対戦表：試合表の組み合わせ（d.bk）に、対戦ごとの点（d.bm）や勝ちを入れ、勝ち上がりを見る
   d.bk = {type:'elim', tree} 勝ち抜き ／ {type:'box', entries:[8組]} 勝ち抜きの後、決勝8人を点数で順位 ／ {type:'rr'} 総当たり
   木は [左,右] の入れ子、葉は選手の番号。選手の最初の演武の点は、採点画面の点（p.s）をそのまま使う */
let BKSEL=null, BKDIV=null;
const isKumite=d=>/組手/.test(d.name);
const pByNo=(d,no)=>no==null?null:(d.players.find(p=>String(p.no)===String(no))||null);
const pName=(d,no)=>{ const p=pByNo(d,no); return p?p.name:''; };
// 表の中の名前は幅に収まるように短くする（ローマ字は文字が細いので長めに）
const short=s=>{ const lim=/^[\x20-\x7e]+$/.test(s)?13:7; return s.length>lim?s.slice(0,lim-1)+'…':s; };
const ht=n=>Array.isArray(n)?1+Math.max(ht(n[0]),ht(n[1])):0;
const calcS=(s,d)=>s?calc({s},d):null;
function parseScore(v){ v=String(v).trim(); if(!v) return null; const n=parseFloat(v); if(isNaN(n)) return null;
  const t=v.includes('.')?Math.round(n*10):(n<=10?n*10:Math.round(n)); return Math.max(0,Math.min(100,t)); }
function bmRec(d,path){ d.bm=d.bm||{}; return d.bm[path]||(d.bm[path]={}); }
function recArr(d,path,k,no,create){ if(no==null) return null; let rec=d.bm&&d.bm[path];
  if(!rec){ if(!create) return null; rec=bmRec(d,path); }
  if(!rec[k]||rec[k].no!==String(no)){ if(!create) return null; rec[k]={no:String(no),s:Array(7).fill(null)}; }
  return rec[k].s; }
function slotArr(d,child,path,k,no,create){ if(no==null) return null;
  if(!Array.isArray(child)){ const p=pByNo(d,no); return p?p.s:null; } return recArr(d,path,k,no,create); }
function decide(d,path,a,b,sa,sb){
  const r={a,b,w:null,ca:null,cb:null,tie:false,manual:false};
  if(a==null||b==null) return r;
  if(!isKumite(d)){ r.ca=calcS(sa,d); r.cb=calcS(sb,d); }
  const rec=(d.bm&&d.bm[path])||{};
  if(rec.w==='A'||rec.w==='B'){ r.w=rec.w==='A'?a:b; r.manual=true; return r; }
  // 欠席：相手が不戦勝で進む
  const xa=!!(pByNo(d,a)||{}).absent, xb=!!(pByNo(d,b)||{}).absent;
  if(xa!==xb){ r.w=xa?b:a; r.bye=true; return r; }
  if(r.ca&&r.cb){ const c=cmp({c:r.ca},{c:r.cb}); if(c<0) r.w=a; else if(c>0) r.w=b; else r.tie=true; }
  return r;
}
function nodeMatch(d,n,path){ const a=bkRes(d,n[0],path+'0'), b=bkRes(d,n[1],path+'1');
  return decide(d,path,a,b,slotArr(d,n[0],path,'a',a),slotArr(d,n[1],path,'b',b)); }
function bkRes(d,n,path){ return Array.isArray(n)?nodeMatch(d,n,path).w:String(n); }
function nodeAt(d,path){ let n,bits; if(path[0]==='T'){ n=d.bk.tree; bits=path.slice(1); } else { n=d.bk.entries[+path[1]]; bits=path.slice(2); }
  for(const c of bits) n=n[+c]; return n; }
function roundName(d,n,path){ if(path==='T') return '決勝'; if(path.length===2&&path[0]==='T') return '準決勝'; return ht(n)+'回戦'; }
function selInfo(d,sel){
  if(sel[0]==='F'){ const k=+sel.slice(1), e=d.bk.entries[k], no=bkRes(d,e,'E'+k);
    return {title:'決勝（8人の点数で順位）', single:true, path:sel, a:no, arrA:c=>slotArr(d,e,sel,'a',no,c)}; }
  if(sel[0]==='R'){ const ij=sel.slice(1).split('-').map(Number), pa=d.players[ij[0]], pb=d.players[ij[1]], a=pa?String(pa.no):null, b=pb?String(pb.no):null;
    return {title:'総当たり', path:sel, a, b, arrA:c=>recArr(d,sel,'a',a,c), arrB:c=>recArr(d,sel,'b',b,c)}; }
  const n=nodeAt(d,sel), a=bkRes(d,n[0],sel+'0'), b=bkRes(d,n[1],sel+'1');
  return {title:roundName(d,n,sel), path:sel, a, b, arrA:c=>slotArr(d,n[0],sel,'a',a,c), arrB:c=>slotArr(d,n[1],sel,'b',b,c)};
}
function finalists(d){ return d.bk.entries.map((e,k)=>{ const no=bkRes(d,e,'E'+k); return {k,no,c:no!=null?calcS(slotArr(d,e,'F'+k,'a',no,false),d):null}; }); }

/* 採点画面と対戦表をつなぐ：選手ごとの演武（何回戦の点か）の一覧。採点画面はここで選んだ回の点を読み書きする */
let RND={};
function findAnc(n,path,no,acc){ if(!Array.isArray(n)) return String(n)===no?acc:null;
  for(const k of [0,1]){ const r=findAnc(n[k],path+k,no,acc.concat([{n,path,side:k}])); if(r) return r; } return null; }
function playerSlots(d,p){
  const no=String(p.no), P={key:'P',label:'',arr:()=>p.s}, bk=d.bk;
  if(!bk||isKumite(d)) return [P];
  if(bk.type==='rr'){ const out=[], i=d.players.indexOf(p);
    d.players.forEach((q,j)=>{ if(j===i) return; const a=Math.min(i,j), b=Math.max(i,j), path='R'+a+'-'+b, k=i<j?'a':'b';
      out.push({key:path+'|'+k,label:'対 '+q.no+' '+q.name,path,arr:c=>recArr(d,path,k,no,c)}); });
    return out.length?out:[P]; }
  const roots=bk.type==='box'?bk.entries.map((n,k)=>[n,'E'+k,k]):[[bk.tree,'T',-1]];
  for(const [n,rp,k] of roots){
    if(!Array.isArray(n)){ if(String(n)===no) return [Object.assign(P,{label:'決勝',path:'F'+k})]; continue; }
    const anc=findAnc(n,rp,no,[]); if(!anc) continue;
    const out=[]; let prev=null;
    for(let i=anc.length-1;i>=0;i--){ const a=anc[i];
      if(prev&&nodeMatch(d,prev.n,prev.path).w!==no) break;
      if(!prev) out.push(Object.assign(P,{label:roundName(d,a.n,a.path),path:a.path}));
      else { const kk=a.side?'b':'a'; out.push({key:a.path+'|'+kk,label:roundName(d,a.n,a.path),path:a.path,arr:c=>recArr(d,a.path,kk,no,c)}); }
      prev=a; }
    if(k>=0&&prev&&nodeMatch(d,prev.n,prev.path).w===no) out.push({key:'F'+k,label:'決勝',path:'F'+k,arr:c=>recArr(d,'F'+k,'a',no,c)});
    return out;
  }
  return [P];
}
function curSlot(d,p){ const L=playerSlots(d,p), s=L.find(x=>x.key===RND[p.id]); if(s) return s;
  if(d.bk&&d.bk.type==='rr') return L.find(x=>{ const a=x.arr(false); return !a||a.slice(0,d.judges).some(v=>v==null); })||L[L.length-1];
  return L[L.length-1]; }
const viewArr=(d,p)=>curSlot(d,p).arr(false)||Array(7).fill(null);   // 見るだけ（記録は作らない）
const writeArr=(d,p)=>{ const s=curSlot(d,p); RND[p.id]=s.key; return s.arr(true)||p.s; };  // 書くとき（入れた回は、その選手を表示している間そのまま）
function slotStatus(d,p,s){
  if(!s.path) return '';
  const no=String(p.no);
  if(s.path[0]==='F'){ const done=finalists(d).filter(x=>x.c).sort(cmp), i=done.findIndex(x=>x.no===no); if(i<0) return '';
    let r=i; while(r>0&&cmp(done[r-1],done[i])===0) r--; return `決勝で <b class="num">${r+1}位</b>（採点済み ${done.length}人中）`; }
  const I=selInfo(d,s.path), m=decide(d,s.path,I.a,I.b,I.arrA(false),I.arrB(false)), other=I.a===no?I.b:I.a;
  const vs=other!=null?`相手 ${other} ${pName(d,other)}`:'相手は前の試合の結果待ち';
  const res=m.bye?(m.w===no?'<b>不戦勝</b>（次の回へ進みます）':'欠席'):m.w==null?(m.tie?'<b>同点</b>（対戦表で勝ちを選んでください）':'結果待ち'):m.w===no?'<b>勝ち</b>（次の回へ進みます）':'負け';
  return `${esc(s.label)}　${esc(vs)}　${res}`;
}
/* 対戦表から採点画面へ：押した試合の選手と回を選んで移る */
let BKFROM=null;
function openInScore(d,sel,no){
  const p=pByNo(d,no); if(!p) return false;
  const s=playerSlots(d,p).find(x=>x.path===sel); if(!s) return false;
  RND={}; RND[p.id]=s.key; d.pi=d.players.indexOf(p); BKFROM={div:d.id,sel}; S.view='score'; return true;
}
function bkBar(d,p,slot){
  if(!BKFROM||BKFROM.div!==d.id||slot.path!==BKFROM.sel) return '';
  const I=selInfo(d,BKFROM.sel), no=String(p.no), other=I.single?null:(I.a===no?I.b:I.a);
  return `<div class="bkbar"><div>対戦表から：<b>${esc(I.title)}</b>${other!=null?`　相手 ${esc(other)} ${esc(pName(d,other))}`:''}</div><div class="row">
    ${other!=null?'<button class="btn" data-a="bkOpp">相手の選手へ</button><button class="btn" data-a="bkWinP">この選手を勝ちにする</button>':''}
    ${other!=null&&d.bm&&d.bm[BKFROM.sel]&&d.bm[BKFROM.sel].w?'<button class="btn" data-a="bkWinClr">勝ちの指定を消す</button>':''}
    <button class="btn" data-a="bkBack">対戦表へ戻る</button></div></div>`;
}
function rndTabs(d,p){ const L=playerSlots(d,p); if(L.length<2&&!L[0].label) return ''; const cur=curSlot(d,p);
  return `<div class="rnd" role="group" aria-label="何回戦の点か">${L.map(s=>`<button data-a="rnd" data-k="${esc(s.key)}" aria-pressed="${s.key===cur.key}">${esc(s.label)}</button>`).join('')}</div>`; }

function viewBk(){
  const d=div(); if(!d) return '<div class="panel"><p>区分がまだありません。</p></div>';
  if(BKDIV!==d.id){ BKSEL=null; BKDIV=d.id; }

  if(!d.bk) return h+'<div class="note">この試合には、対戦表（組み合わせ）が入っていません。</div></div>';
  return h+`<div id="bkEd"></div><div id="bkBody"></div>${chgHtml(d)}</div>`;
}
/* 組み合わせを変える：欠席・差し替え・追加（11/23 CEO回答A） */
let CHGOPEN=false;
const treeNos=d=>{ const bk=d.bk; if(!bk||bk.type==='rr') return d.players.map(p=>String(p.no)); const L=n=>Array.isArray(n)?n.flatMap(L):[String(n)]; return L(bk.type==='box'?bk.entries:bk.tree); };
function mapLeaf(n,no,f){ if(!Array.isArray(n)) return String(n)===no?f(String(n)):n; return [mapLeaf(n[0],no,f),mapLeaf(n[1],no,f)]; }
function bkReplaceLeaf(d,no,f){ const bk=d.bk; if(bk.type==='box') bk.entries=bk.entries.map(e=>mapLeaf(e,no,f)); else bk.tree=mapLeaf(bk.tree,no,f); d.bkv=Date.now(); }
function chgHtml(d){
  if(!CHGOPEN) return `<div class="row" style="margin-top:12px"><button class="btn" data-a="chgOpen">組み合わせを変える（欠席・差し替え・追加）</button></div>`;
  const nos=treeNos(d), opt=f=>nos.map(no=>{ const p=pByNo(d,no); return p&&f(p)?`<option value="${esc(no)}">${esc(no)} ${esc(p.name)}${p.absent?'（欠席）':''}</option>`:''; }).join('');
  const nextNo=Math.max(0,...d.players.map(p=>parseInt(p.no)||0))+1, rr=d.bk.type==='rr';
  return `<div class="bkchg"><div class="row" style="justify-content:space-between"><b>組み合わせを変える</b><button class="btn" data-a="chgOpen">閉じる</button></div>
    <h4>欠席</h4><div class="note">欠席にした選手の相手は、不戦勝で次へ進みます。もう一度押すと取り消せます。</div>
    <div class="row"><select id="chgAbs" class="grow">${opt(()=>true)}</select><button class="btn" data-a="chgAbs">切り替える</button></div>
    <h4>新しい選手</h4><div class="pinfo"><input type="text" id="chgNo" value="${nextNo}" placeholder="番号" aria-label="新しい選手の番号"><input type="text" id="chgName" placeholder="氏名" aria-label="新しい選手の氏名"><input type="text" id="chgTeam" placeholder="所属" aria-label="新しい選手の所属"></div>
    <h4>差し替え</h4><div class="note">${rr?'選んだ選手を欠席にし、新しい選手を総当たりに加えます。':'選んだ選手の枠に、新しい選手を入れます。選んだ選手は欠席になります。'}</div>
    <div class="row"><select id="chgRep" class="grow">${opt(p=>p.absent)||opt(()=>true)}</select><button class="btn" data-a="chgRep">差し替える</button></div>
    <h4>追加</h4><div class="note">${rr?'新しい選手を総当たりに加えます。':'選んだ選手と新しい選手の試合を1つ足します（選んだ選手は、この試合に勝つと元の枠へ進みます）。'}</div>
    <div class="row">${rr?'':`<select id="chgAdd" class="grow">${opt(p=>!p.absent)}</select>`}<button class="btn" data-a="chgAdd">追加する</button></div></div>`;
}
function readNewPlayer(d){
  const no=document.getElementById('chgNo').value.trim(), name=document.getElementById('chgName').value.trim(), team=document.getElementById('chgTeam').value.trim();
  if(!no||!name){ toast('新しい選手の番号と氏名を入れてください。'); return null; }

}
function drawBk(withEd){
  const d=div(); if(!d||!d.bk) return;
  if(withEd!==false){ const e=document.getElementById('bkEd'); if(e) e.innerHTML=edHtml(d); }
  const b=document.getElementById('bkBody'); if(b) b.innerHTML=bodyHtml(d);

}
function edHtml(d){
  if(!BKSEL) return `<div class="note">${d.bk.type==='rr'?'下の対戦を押すと':'表の縦の線を押すと'}、その試合の${isKumite(d)?'勝ちを入れられます。':'点を入れられます。点の高い選手が、自動で次へ進みます。「採点」のタブにも、同じ試合が出ます。'}</div>`;
  const I=selInfo(d,BKSEL);
  if(I.a==null||(!I.single&&I.b==null)) return `<div class="bked"><b>${esc(I.title)}</b><div class="note">前の試合の結果が、まだ出ていません。</div><button class="btn" data-a="bkClose">閉じる</button></div>`;
  const side=(k,no,arr)=>{ const p=pByNo(d,no);
    const ins=isKumite(d)?'':`<div class="bkin">${Array.from({length:d.judges},(_,j)=>`<input type="text" inputmode="decimal" autocomplete="off" data-bks="${k}" data-j="${j}" value="${arr&&arr[j]!=null?f(arr[j]):''}" placeholder="${j===0?'主':j}" aria-label="${J_NAMES[j]}">`).join('')}</div><div class="bkpt" id="bkpt${k}"></div>`;
    const win=I.single?'':`<button class="btn" data-a="bkWin" data-w="${k}">${isKumite(d)?'この選手の勝ち':'この選手を勝ちにする'}</button>`;
    const ab=p?`<button class="btn" data-a="absentNo" data-no="${esc(no)}">${p.absent?'欠席を取り消す':'欠席にする'}</button>`:'';
    return `<div class="bkside"><div class="bkname">${esc(no)} ${esc(p?p.name:'')}${p&&p.absent?'（欠席）':''}<small>${esc(p?p.team:'')}</small></div>${ins}<div class="row">${win}${ab}</div></div>`; };
  return `<div class="bked"><b>${esc(I.title)}</b>${side('A',I.a,I.arrA(false))}${I.single?'':side('B',I.b,I.arrB(false))}
    <div id="bkRes" class="bkres"></div><div class="row">${I.single?'':'<button class="btn" data-a="bkWin" data-w="">勝ちの指定を消す</button>'}<button class="btn" data-a="bkClose">閉じる</button></div>
    ${isKumite(d)||I.single||I.path[0]==='R'?'':'<div class="note">1回目の演武の点は、採点画面の点と同じものです。</div>'}</div>`;
}
function drawBkRes(d){
  const el=document.getElementById('bkRes'); if(!el||!BKSEL) return;
  const I=selInfo(d,BKSEL); if(I.a==null) return;
  const ca=calcS(I.arrA(false),d), pa=document.getElementById('bkptA'); if(pa) pa.textContent=ca?'得点 '+f(ca.base):'';
  if(I.single){ el.textContent=ca?'得点 '+f(ca.base):'点を入れてください。'; return; }
  const m=decide(d,I.path,I.a,I.b,I.arrA(false),I.arrB(false)), pb=document.getElementById('bkptB'); if(pb) pb.textContent=m.cb?'得点 '+f(m.cb.base):'';
  el.textContent=m.w!=null?`${m.bye?'不戦勝':'勝ち'}：${m.w} ${pName(d,m.w)}${m.manual?'（指定）':''}`:m.tie?'同点です。勝った選手を押してください。':isKumite(d)?'勝った選手を押してください。':'両方の点を入れてください。';
}
function bodyHtml(d){
  const leg='<div class="bkleg"><b class="w">赤い線</b>＝勝ち上がり　<b class="r">青い線</b>＝結果を待っている試合　灰色の名前＝敗退</div>';
  if(d.bk.type==='rr') return rrHtml(d);
  return leg+`<div class="bkwrap">${bkSvg(d)}</div>`+(d.bk.type==='box'?finalHtml(d):'');
}
function bkSvg(d){
  const bk=d.bk, box=bk.type==='box', roots=box?bk.entries.map((n,k)=>[n,'E'+k]):[[bk.tree,'T']];
  const RH=30, NW=128, CW=30, mh=Math.max(...roots.map(r=>ht(r[0])));
  let row=0; const L=[], T=[], H=[], names=[], lost=new Set();
  const seg=(x1,y1,x2,y2,c)=>L.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"${c?` class="${c}"`:''}/>`);
  function lay(n,path){
    if(!Array.isArray(n)){ const y=row++*RH+RH/2; names.push({no:String(n),y}); return {x:NW,y}; }
    const A=lay(n[0],path+'0'), B=lay(n[1],path+'1'), x=NW+ht(n)*CW, my=(A.y+B.y)/2, m=nodeMatch(d,n,path);
    const ready=m.a!=null&&m.b!=null&&m.w==null, wa=m.w!=null&&m.w===m.a, wb=m.w!=null&&m.w===m.b;
    if(m.w!=null) lost.add(wa?m.b:m.a);
    seg(A.x,A.y,x,A.y,wa?'w':''); seg(B.x,B.y,x,B.y,wb?'w':'');
    seg(x,A.y,x,my,wa?'w':ready?'r':''); seg(x,my,x,B.y,wb?'w':ready?'r':'');
    if(m.ca) T.push(`<text x="${x-3}" y="${A.y-4}" class="sc">${f(m.ca.base)}</text>`);
    if(m.cb) T.push(`<text x="${x-3}" y="${B.y-4}" class="sc">${f(m.cb.base)}</text>`);
    if(m.tie) T.push(`<text x="${x+4}" y="${my+4}" class="tie">同点</text>`);
    H.push(`<rect x="${x-13}" y="${A.y-8}" width="26" height="${B.y-A.y+16}" class="hit${BKSEL===path?' sel':''}" data-a="bkPick" data-s="${path}"/>`);
    return {x,y:my};
  }
  const outs=roots.map(([n,p])=>Object.assign(lay(n,p),{w:bkRes(d,n,p)}));
  const ox=NW+(mh+1)*CW; let champ=null, W;
  if(box){
    outs.forEach(o=>seg(o.x,o.y,ox,o.y,o.w!=null?'w':''));
    const y1=Math.min(...outs.map(o=>o.y))-12, y2=Math.max(...outs.map(o=>o.y))+12;
    L.push(`<rect x="${ox}" y="${y1}" width="26" height="${y2-y1}" class="fin"/><text x="${ox+13}" y="${(y1+y2)/2-4}" class="fint">決</text><text x="${ox+13}" y="${(y1+y2)/2+12}" class="fint">勝</text>`);
    W=ox+34;
  } else {
    const o=outs[0]; champ=o.w; seg(o.x,o.y,ox,o.y,champ!=null?'w':'');
    if(champ!=null) T.push(`<text x="${ox+4}" y="${o.y+4}" class="nm ch">優勝 ${esc(pName(d,champ))}</text>`);
    W=ox+130;
  }
  const N=names.map(r=>`<text x="2" y="${r.y+4}" class="nm${lost.has(r.no)?' out':''}${champ===r.no?' ch':''}">${esc(r.no)} ${esc(short(pName(d,r.no)))}${(pByNo(d,r.no)||{}).absent?'（欠席）':''}</text>`);
  const Hh=row*RH+6;
  return `<svg class="bksvg" width="${W}" height="${Hh}" viewBox="0 0 ${W} ${Hh}" xmlns="http://www.w3.org/2000/svg">${N.join('')}${L.join('')}${T.join('')}${H.join('')}</svg>`;
}
function finalHtml(d){
  const F=finalists(d), done=F.filter(x=>x.c).sort(cmp);
  done.forEach((r,i)=>r.rank=(i>0&&cmp(done[i-1],r)===0)?done[i-1].rank:i+1);
  const rest=F.filter(x=>!x.c);
  return `<h3>決勝（8人の点数で順位）</h3>`+[...done,...rest].map(x=>`<button class="srow${BKSEL==='F'+x.k?' sel':''}" data-a="bkPick" data-s="F${x.k}"><span>${x.rank?`<b>${x.rank}位</b>　`:''}${x.no!=null?esc(x.no)+' '+esc(pName(d,x.no)):'（勝ち上がり待ち）'}</span><span class="no">${x.c?'得点 <b>'+f(x.c.base)+'</b>':x.no!=null?'点を入れる':''}</span></button>`).join('');
}
function rrHtml(d){
  const P=d.players, wins=P.map(()=>0), done=P.map(()=>0); let rows='';
  for(let i=0;i<P.length;i++) for(let j=i+1;j<P.length;j++){
    const path='R'+i+'-'+j, I=selInfo(d,path), m=decide(d,path,I.a,I.b,I.arrA(false),I.arrB(false));
    if(m.w!=null){ wins[m.w===I.a?i:j]++; done[i]++; done[j]++; }
    rows+=`<button class="srow${BKSEL===path?' sel':''}" data-a="bkPick" data-s="${path}"><span>${esc(P[i].no)} ${esc(P[i].name)}　対　${esc(P[j].no)} ${esc(P[j].name)}</span><span class="no">${m.w!=null?(m.bye?'不戦勝：':'勝ち：')+'<b>'+esc(pName(d,m.w))+'</b>':m.tie?'同点':'未'}</span></button>`; }
  const order=P.map((p,i)=>i).sort((x,y)=>wins[y]-wins[x]);
  return `<h3>対戦（${P.length*(P.length-1)/2}試合）</h3>${rows}<h3>勝ち数</h3><table class="bktbl"><tr><th>番号</th><th>氏名</th><th>勝ち</th><th>終わった試合</th></tr>${order.map(i=>`<tr><td>${esc(P[i].no)}</td><td>${esc(P[i].name)}</td><td><b>${wins[i]}</b></td><td>${done[i]}／${P.length-1}</td></tr>`).join('')}</table>`;
}

/* 送られてきたデータの読み取りと取り込み */
function readPasted(src){
  const t=src!=null?src:document.getElementById('restore').value, a=t.indexOf('{'), b=t.lastIndexOf('}');
  if(a<0||b<a) return null;
  try{ const o=JSON.parse(t.slice(a,b+1)); if(!o||!Array.isArray(o.divs)) return null;
    o.divs.forEach(d=>{ d.id=d.id||uid(); d.name=String(d.name||''); d.judges=[3,5,7].includes(d.judges)?d.judges:7; d.base=typeof d.base==='number'?d.base:70; d.pi=0;
      d.players=(d.players||[]).map(p=>({id:p.id||uid(),no:String(p.no||''),name:String(p.name||''),kana:String(p.kana||''),team:String(p.team||''),memo:String(p.memo||''),
        s:Array.from({length:7},(_,j)=>typeof (p.s||[])[j]==='number'?p.s[j]:null)})); });
    return o; }catch(e){ return null; }
}
function mergeIn(o){
  const r={addD:0,addP:0,upd:0,diff:0};
  o.divs.forEach(id=>{
    const ld=S.divs.find(x=>x.id===id.id)||S.divs.find(x=>x.name.trim()===id.name.trim());
    if(!ld){ S.divs.push(id); r.addD++; r.addP+=id.players.length; return; }
    if(id.sched) ld.sched=id.sched;
    // 組み合わせは、新しく変えられた方（bkv が大きい方）を使う
    if(id.bk&&(!ld.bk||(id.bkv||0)>(ld.bkv||0))){ ld.bk=id.bk; ld.bkv=id.bkv||0; }
    if(id.bm){ ld.bm=ld.bm||{}; for(const k in id.bm){ const ir=id.bm[k], lr=ld.bm[k]||(ld.bm[k]={});
      if(ir.w&&!lr.w) lr.w=ir.w;
      ['a','b'].forEach(s=>{ if(!ir[s]) return; if(!lr[s]||lr[s].no!==ir[s].no){ if(!lr[s]) lr[s]=ir[s]; return; }
        for(let j=0;j<7;j++) if(ir[s].s[j]!=null) lr[s].s[j]=ir[s].s[j]; }); } }
    id.players.forEach(ip=>{
      const lp=ld.players.find(x=>x.id===ip.id)||ld.players.find(x=>(x.no||x.name)&&x.no.trim()===ip.no.trim()&&x.name.trim()===ip.name.trim());
      if(!lp){ ld.players.push(ip); r.addP++; return; }
      let ch=false, df=false;
      for(let j=0;j<7;j++) if(ip.s[j]!=null&&ip.s[j]!==lp.s[j]){ if(lp.s[j]!=null) df=true; lp.s[j]=ip.s[j]; ch=true; }
      if(!lp.team&&ip.team) lp.team=ip.team;
      if(ip.absent) lp.absent=true;
      if(!lp.kana&&ip.kana) lp.kana=ip.kana;
      if(!lp.memo&&ip.memo) lp.memo=ip.memo;
      if(ch) r.upd++; if(df) r.diff++;
    });
  });
  return r;
}

/* 2回押しで実行 */
let armed=null, armTimer=null;
function confirm2(id,label){
  if(armed===id){ armed=null; clearTimeout(armTimer); return true; }
  armed=id; const el=document.getElementById(id); if(el){ el.classList.add('armed'); el.dataset.old=el.textContent; el.textContent=label||'もう一度押すと実行'; }
  clearTimeout(armTimer); armTimer=setTimeout(()=>{ const e=document.getElementById(id); if(e){e.classList.remove('armed'); e.textContent=e.dataset.old;} armed=null; },3000);
  return false;
}

/* 数字入力 */
let padJ=null, padBuf='';
const PAD=document.getElementById('pad');
function parsePad(b){
  if(!b) return null;
  let v;
  if(b.includes('.')){ if(!/^\d{1,2}\.\d?$/.test(b)) return NaN; v=Math.round(parseFloat(b)*10); }
  else if(b.length===1) v=+b*10;
  else if(b==='10'||b==='100') v=100;
  else if(b.length===2) v=+b;
  else return NaN;
  return (v>=0&&v<=100)?v:NaN;
}
function openPad(j){ padJ=j; padBuf=''; drawPad(); PAD.hidden=false; }
function drawPad(){
  const d=div(), p=player(d), v=parsePad(padBuf), isBase=padJ==='base', cur=isBase?d.base:viewArr(d,p)[padJ];
  const who=isBase?'基準点':J_NAMES[padJ]+'（'+esc(p.name)+'）';
  const shown=padBuf===''?(cur==null?'—':f(cur)):(Number.isNaN(v)?'0.0〜10.0で入れてください':f(v));
  PAD.innerHTML=`<div class="pad-card" role="dialog" aria-label="${isBase?'基準点':J_NAMES[padJ]+'の点'}を入力">
    <div class="pad-head"><b>${who}</b><button class="btn" data-a="padClose">閉じる</button></div>
    <div class="pad-val ${padBuf&&Number.isNaN(v)?'err':''}">${shown}</div>
    <div class="note">「85」と押すと 8.5、「7」だけなら 7.0 になります。</div>
    <div class="keys">${['1','2','3','4','5','6','7','8','9','.','0','消'].map(k=>`<button data-a="k" data-k="${k}">${k}</button>`).join('')}</div>
    <button class="pad-ok" data-a="padOk">${!isBase&&padJ<d.judges-1?'決定して次の審判へ':'決定'}</button></div>`;
}
function padOk(){
  const d=div(), p=player(d), v=parsePad(padBuf);
  if(padJ==='base'){ if(padBuf!==''){ if(Number.isNaN(v)){ drawPad(); return; } d.base=v; save(); } PAD.hidden=true; render(); return; }
  if(padBuf!==''){ if(Number.isNaN(v)){ drawPad(); return; } writeArr(d,p)[padJ]=v; save(); }
  if(padJ<d.judges-1){ padJ++; padBuf=''; render(); drawPad(); } else { PAD.hidden=true; render(); }
}

document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') wake.l=null; });

  if(!BIG.hidden){ BIG.hidden=true; return; }

    case 'chgRep': { const old=pByNo(d,document.getElementById('chgRep').value), q=readNewPlayer(d); if(!old||!q) return;
      d.players.push(q); old.absent=true; if(d.bk.type!=='rr') bkReplaceLeaf(d,String(old.no),()=>String(q.no)); else d.bkv=Date.now();
      toast(`${old.no} ${old.name} の枠に ${q.no} ${q.name} を入れました`); break; }
    case 'chgAdd': { const q=readNewPlayer(d); if(!q) return;
      if(d.bk.type==='rr'){ d.players.push(q); d.bkv=Date.now(); toast(`${q.no} ${q.name} を総当たりに加えました`); break; }
      const t=pByNo(d,document.getElementById('chgAdd').value); if(!t) return;

    case 'bkWinClr': { if(!BKFROM) return; const r=d.bm&&d.bm[BKFROM.sel]; if(r) delete r.w; break; }
    case 'bkBack': BKFROM=null; S.view='bk'; break;
    case 'bkWin': { if(!BKSEL) return; const rec=bmRec(d,BKSEL); if(b.dataset.w) rec.w=b.dataset.w; else delete rec.w; break; }
    case 'judges': d.judges=d.judges===7?5:d.judges===5?3:7; break;
    case 'base': d.base=Math.max(0,Math.min(100,d.base+ +b.dataset.d)); break;

      if(a==='restore'){ if(!confirm2('restoreBtn','もう一度押すと入れ替えます')) return; S.divs=o.divs; S.tie=o.tie||S.tie; S.title=o.title||S.title||''; S.cur=0; save(); render(); document.getElementById('mergeMsg').textContent='入れ替えました（区分'+o.divs.length+'つ）。'; return; }

      return; }
    case 'wipe': if(!confirm2('wipeBtn','もう一度押すと全部消します')) return; S.divs=[]; S.cur=0; break;

    case 'tStart': ensureAudio(); if(T.ended) return;

    case 'tWarn': S.timer.warn=Math.max(0,Math.min(S.timer.dur-5000,S.timer.warn+ +b.dataset.d)); break;
    /* 形カード */
    case 'kDraw': { const pool=KATA.filter(k=>!S.kataOff.includes(k[0]));
      if(!pool.length){ document.getElementById('kCard').innerHTML='<span class="note">対象の形を1つ以上選んでください</span>'; return; }
      let pick=pool[Math.floor(Math.random()*pool.length)];
      if(pool.length>1) while(pick[0]===S.kataLast) pick=pool[Math.floor(Math.random()*pool.length)];
      S.kataLast=pick[0]; save(); render(); const c=document.getElementById('kCard'); c.classList.remove('flip'); void c.offsetWidth; c.classList.add('flip'); return; }
    case 'kSet': { const k=b.dataset.k; S.kataOff = k==='all'?[]:k==='none'?KATA.map(x=>x[0]):KATA.filter(x=>!/^平安|^鉄騎/.test(x[0])).map(x=>x[0]); break; }
    default: return;
  }
  save(); render();
});
document.addEventListener('change',e=>{
  const t=e.target, d=div();
  if(t.id==='divSel'){ RND={}; S.cur=+t.value; save(); render(); }
  else if(t.id==='pSel'){ RND={}; d.pi=+t.value; save(); render(); }
  else if(t.name==='tie'){ S.tie=t.value; save(); }
  else if(t.id==='fileIn'&&t.files&&t.files[0]){ const fr=new FileReader(), msg=document.getElementById('mergeMsg');
    fr.onload=()=>{ document.getElementById('restore').value=String(fr.result||''); msg.textContent='ファイルを読み込みました。初めて入れるときは「置き換える」、今のデータに足すときは「取り込む」を押してください。'; };
    fr.onerror=()=>{ msg.textContent='ファイルを読めませんでした。'; };
    fr.readAsText(t.files[0]); t.value=''; }
  else if(t.dataset.kata){ const k=t.dataset.kata; S.kataOff=S.kataOff.filter(x=>x!==k); if(!t.checked) S.kataOff.push(k); save(); render(); }
});
document.addEventListener('input',e=>{
  const t=e.target, d=div(), p=player(d);
  if(t.id==='pNo') p.no=t.value; else if(t.id==='pName') p.name=t.value; else if(t.id==='pTeam') p.team=t.value; else if(t.id==='pMemo') p.memo=t.value;
  else if(t.id==='sq'){ SQ=t.value; drawSearch(); return; }
  else if(t.dataset.bks&&BKSEL){ const I=selInfo(d,BKSEL), arr=(t.dataset.bks==='A'?I.arrA:I.arrB)(true); if(!arr) return;
    arr[+t.dataset.j]=parseScore(t.value); save(); drawBk(false); return; }
  else if(t.id==='tTitle'){ S.title=t.value; document.getElementById('ttl').textContent=t.value; }
  else if(t.dataset.div!=null) S.divs[+t.dataset.div].name=t.value;
  else if(t.dataset.pf) d.players[+t.dataset.pi][t.dataset.pf]=t.value;
  else return;
  save();
});
document.addEventListener('keydown',e=>{
  if(PAD.hidden) return;
  if(/^[0-9.]$/.test(e.key)){ if(padBuf.length<4) padBuf+=e.key; drawPad(); e.preventDefault(); }
  else if(e.key==='Backspace'){ padBuf=padBuf.slice(0,-1); drawPad(); e.preventDefault(); }
  else if(e.key==='Enter'){ padOk(); e.preventDefault(); }
  else if(e.key==='Escape'){ PAD.hidden=true; render(); }
});
save(); render();

/* 大会専用のリンク（#のあとが鍵）で開いたら、暗号にした大会データを読み込む */
function toast(msg){ let el=document.getElementById('toast'); if(!el){ el=document.createElement('div'); el.id='toast'; el.className='toast'; document.body.appendChild(el); }
  el.textContent=msg; el.hidden=false; clearTimeout(el._t); el._t=setTimeout(()=>{ el.hidden=true; },6000); }
async function loadTaikai(){
  const key=decodeURIComponent(location.hash.slice(1)).trim(); if(!key||!(window.crypto&&crypto.subtle)) return;
  let enc; try{ enc=await (await fetch('taikai.enc.json',{cache:'no-cache'})).json(); }catch(e){ return; }
  if(!enc||!enc.salt||S.dataTag===enc.salt) return;
  toast('大会データを読み込んでいます…');
  const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  let text;
  try{ const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(key),'PBKDF2',false,['deriveKey']);
    const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(enc.salt),iterations:enc.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    text=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(enc.iv)},k,b(enc.ct)));
  }catch(e){ toast('リンクの鍵が違うため、大会データを読めませんでした。'); return; }
  const o=readPasted(text); if(!o){ toast('大会データを読めませんでした。'); return; }
  const onlySample=S.divs.every(d=>/^例）/.test(d.name));
  if(onlySample){ S.divs=o.divs; S.cur=0; } else mergeIn(o);
  S.title=o.title||S.title; S.tie=o.tie||S.tie; S.dataTag=enc.salt; save(); render();
  toast(`大会データを読み込みました（${o.divs.length}試合・${o.divs.reduce((a,d)=>a+d.players.length,0)}人）`);
}
loadTaikai(); window.addEventListener('hashchange',loadTaikai);
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
